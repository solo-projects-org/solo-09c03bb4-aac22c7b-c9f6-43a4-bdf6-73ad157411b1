services:
  delta-recovery:
    build: .
    image: delta-recovery-analyzer:latest
    container_name: delta-recovery-analyzer
    ports:
      - "8000:8000"
    environment:
      # 内置样例目录（容器内路径）；可通过挂载覆盖
      SAMPLE_ROOT: /srv/samples
      # 核查状态（首屏报告 + 原始输入 + 惰性明细缓存）放在共享卷，
      # gunicorn 多个 worker（不同进程）都能读写同一份状态。
      ANALYSIS_DB_PATH: /srv/state/analyses.sqlite3
    volumes:
      # 把宿主任意 Delta 表目录挂进来，便于用样例之外的真实留存材料验证
      - ./samples:/srv/samples:ro
      # 分页明细跨进程 / 跨请求复用，重启容器后仍可继续翻页
      - analysis-state:/srv/state
    restart: unless-stopped

volumes:
  analysis-state:
